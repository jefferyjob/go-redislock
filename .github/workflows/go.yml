name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  linux-build:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.2
        ports:
          - 63790:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      matrix:
        go-version: [ '1.21' ]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          check-latest: true
          cache: true
        id: go

      - name: GO Env
        run: |
          go version
          go env

      - name: Get dependencies
        run: |
          go get -v -t -d ./...

      - name: Lint
        run: |
          go vet $(go list ./...)
          go mod tidy
          if ! test -z "$(git status --porcelain)"; then
            echo "Please run 'go mod tidy'"
            exit 1
          fi

      - name: Build
        run: go build -v ./...

      # Test Unit
      - name: Test
        run: make test

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@v1.12.0

      # 根模块单元测试基于 mock（不依赖 Redis），覆盖率写入 unit-coverage.txt。
      # -coverpkg 限定只统计库本身的语句，避免把无测试的 mocks/examples 包计为 0%。
      - name: Unit test and create coverage file
        run: |
          go test -race -coverpkg=github.com/jefferyjob/go-redislock \
            -coverprofile=unit-coverage.txt -covermode=atomic ./...

      # 测试套件在 tests/ 独立模块中（多模块仓库，根目录的 ./... 不包含它），
      # 依赖本 job 的 Redis 服务（127.0.0.1:63790）。
      # -coverpkg 将覆盖率归属到根模块；gotestsum 一次运行同时产出 junit.xml 与 coverage.txt，
      # 避免测试套件跑两遍。
      - name: Test and create coverage file
        run: |
          cd tests
          gotestsum --junitfile ../junit.xml -- \
            -race -coverprofile=../coverage.txt -covermode=atomic \
            -coverpkg=github.com/jefferyjob/go-redislock ./...

      # 两份报告由 Codecov 合并：单测覆盖 Go 层分支，集成测试覆盖真实 Redis 语义。
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.txt,./unit-coverage.txt
          token: ${{secrets.CODECOV_TOKEN}}

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
